name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The source bundle does not include gradle-wrapper.jar, so CI installs the
      # pinned Gradle version explicitly instead of relying on ./gradlew.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Test, lint and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
