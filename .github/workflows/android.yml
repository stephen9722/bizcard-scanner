name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The source bundle does not include gradle-wrapper.jar, so CI installs the
      # pinned Gradle version explicitly instead of relying on ./gradlew.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Test, lint and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BizCardScanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-beta:
    name: Publish v0.1.1-beta
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: BizCardScanner-debug
          path: release

      - name: Prepare release APK
        run: mv release/app-debug.apk release/BizCardScanner-v0.1.1-beta-debug.apk

      - name: Create beta release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.1-beta already exists; keeping the existing versioned release."
          else
            gh release create v0.1.1-beta release/BizCardScanner-v0.1.1-beta-debug.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BizCard Scanner v0.1.1-beta" --prerelease --notes "Adds one-tap phone transfer: generate a complete ZIP backup and send it through Android's share sheet to Quick Share, Google Drive, LINE, Mail, or another compatible app. Includes all previous offline OCR, perspective correction, backup/import, parser, and reliability fixes. This is a debug-signed beta APK intended for direct testing, not Play Store distribution."
          fi
