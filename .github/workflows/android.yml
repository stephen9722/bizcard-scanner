name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Test, lint and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BizCardScanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-beta:
    name: Publish v0.3.1-beta (fixed signed)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BIZCARD_KEYSTORE_B64: ${{ secrets.BIZCARD_KEYSTORE_B64 }}
      BIZCARD_KEYSTORE_PASSWORD: ${{ secrets.BIZCARD_KEYSTORE_PASSWORD }}
      BIZCARD_KEY_ALIAS: ${{ secrets.BIZCARD_KEY_ALIAS }}
      BIZCARD_KEY_PASSWORD: ${{ secrets.BIZCARD_KEY_PASSWORD }}

    steps:
      - name: Check fixed signing secrets
        id: signing
        shell: bash
        run: |
          if [[ -n "$BIZCARD_KEYSTORE_B64" && -n "$BIZCARD_KEYSTORE_PASSWORD" && -n "$BIZCARD_KEY_ALIAS" && -n "$BIZCARD_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fixed beta signing secrets are not configured yet; signed release publishing is skipped."
          fi

      - name: Checkout source
        if: steps.signing.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK tools
        if: steps.signing.outputs.available == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        if: steps.signing.outputs.available == 'true'
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Decode fixed signing keystore
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/bizcard-beta.p12"
          printf '%s' "$BIZCARD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "BIZCARD_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build fixed-signed release APK
        if: steps.signing.outputs.available == 'true'
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signing certificate
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload fixed-signed beta APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BizCardScanner-v0.3.1-beta-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Prepare release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/BizCardScanner-v0.3.1-beta.apk

      - name: Create beta release if missing
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.3.1-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.1-beta already exists; keeping the existing fixed-signed release."
          else
            gh release create v0.3.1-beta release/BizCardScanner-v0.3.1-beta.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BizCard Scanner v0.3.1-beta" --prerelease --notes "Fixes the card-holder list to show visible created-date section headers like CamCard/全能名片王. Cards are grouped and ordered by createdAt, so editing an older card no longer moves it into the newest section. Keeps the v0.3.0 CSV migration, original created-date preservation, joined/updated timestamps, system contact handoff, and permanent BizCard signing key."
          fi
